[package]
name = "vsn"
version = "0.1.0"
edition = "2024"

[dependencies]
# The types of gpui-component's editor LSP providers; both already in its build.
anyhow = "1"
dirs = "6"
futures = "0.3"
gpui-kit = { version = "0.8", features = ["tree-sitter-languages"] }
ignore = "0.4"
lsp-types = "0.97"
notify = "8"
portable-pty = "0.9.0"
regex = "1"
serde_json = "1.0.154"
# Go to Symbol's tags queries; gpui-kit already builds these grammars.
tree-sitter = "0.26"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-typescript = "0.23"
unicode-segmentation = "1"
# Open VSX: extension search and .vsix downloads.
ureq = "3"
vt100 = "0.18.1"
# WebAssembly plugins (EXTENSIONS.md phase 5); wit-component turns a core module
# into a component.
wasmtime = { version = "50", default-features = false, features = ["anyhow", "cranelift", "runtime", "component-model", "std"] }
wit-component = "0.262"

# Extension webviews (draw.io and other custom editors) run in WebView2.
[target.'cfg(windows)'.dependencies]
gpui-pre-windows = "=0.3.9"
raw-window-handle = "0.6"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_DirectComposition", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"

[build-dependencies]
embed-resource = "3"

# Local fixes to gpui crates; see vendor/README.md.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
gpui-base = { path = "vendor/gpui-base" }
